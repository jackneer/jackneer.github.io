# -------------------------------------------------------------------
# Jack Wu's Docs — site configuration
# Theme docs: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# -------------------------------------------------------------------

title: "Jack Wu's Docs"
description: >-
  A personal knowledge base and documentation site, published with GitHub Pages.

# GitHub Pages "user site" (https://USERNAME.github.io) must keep baseurl "".
url: "https://jackneer.github.io"
baseurl: ""

# Theme — fetched from GitHub at build time; nothing to vendor or update by hand.
remote_theme: mmistakes/minimal-mistakes@4.28.1

# ---- Minimal Mistakes options ---------------------------------------------
minimal_mistakes_skin: air

search: true
breadcrumbs: true
enable_copy_code_button: true

# Index plain pages (site.pages) in the lunr store, not just collection docs.
# Without this the theme ships an empty `var store = []` and search is silent.
lunr:
  search_within_pages: true

author:
  name: "Jack Wu"
  bio: "A personal knowledge base, written on a phone."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jackneer"

footer:
  links:
    - label: "GitHub Repository"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jackneer/jackneer.github.io"

# ---- Plugins ---------------------------------------------------------------
# Required by Minimal Mistakes; all are on the GitHub Pages allowlist.
# `whitelist` mirrors `plugins` so a --safe build loads the same set.
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from

# ---- Front-matter defaults -------------------------------------------------
# Minimal Mistakes has no fallback layout: without this block every page
# renders without the theme. `sidebar.nav` points at the "docs" tree in
# _data/navigation.yml.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      sidebar:
        nav: "docs"
      toc: true
      toc_sticky: true

# ---- Files excluded from the published site --------------------------------
# Keep repo/tooling metadata out of the generated output.
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
