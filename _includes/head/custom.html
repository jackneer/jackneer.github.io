<!--
  Mermaid diagrams.

  GitHub Pages runs the `github-pages` gem, whose plugin allowlist excludes
  Mermaid plugins — but none is needed: Mermaid renders client-side. This local
  include overrides the theme's empty `_includes/head/custom.html`, which
  `_layouts/default.html` injects into every page's <head>.

  Usage in any page:

      ```mermaid
      graph LR
        A[Draft] --> B[main]
        B --> C[Deploy]
      ```

  kramdown turns that fence into <pre><code class="language-mermaid">, whereas
  Mermaid only renders elements with class "mermaid", so the script rewrites the
  block before running Mermaid. `type="module"` defers execution until the DOM
  is parsed, so no DOMContentLoaded wrapper is required.
-->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  mermaid.initialize({ startOnLoad: false, theme: "neutral" });

  document.querySelectorAll("code.language-mermaid").forEach((code) => {
    const target = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    target.replaceWith(div);
  });

  await mermaid.run({ querySelector: ".mermaid" });
</script>
